<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Member portal for Top Ladies of Distinction, Inc., Dallas Chapter.">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>TLOD Dallas Member Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Source+Sans+3:wght@400;600;700&display=swap">
<style id="portal-style">
/* Layout: a chapter handbook on a white page. A white sidebar lists every section, grouped the way the chapter works (chapter, service, people, reference); content reads in one column with side panels on wide screens. Ladies in pink, Top Teens in blue, navy for controls. Light theme only. */
:root {
  --ground: #ffffff;
  --sunk: #f6f7fa;
  --surface: #ffffff;
  --ink: #17203a;
  --muted: #4f5b73;
  --line: #dfe3ea;
  --accent: #1f2f5c;
  --accent-soft: #eceff6;
  --lady: #b0285f;
  --lady-soft: #fdebf3;
  --lady-card: #fff4f8;
  --lady-line: #f3cfdf;
  --tta: #1565c0;
  --tta-soft: #e5effc;
  --on-accent: #ffffff;
  --gold: #8a6514;
  --nav-bg: #ffffff;
  --nav-ink: #17203a;
  --nav-dim: #5f6a80;
  --nav-active: #fdebf3;
  --nav-active-ink: #b0285f;
  --nav-hover: #f3f5f9;
  --good: #23704a;
  --warn: #8a5410;
  --hold: #5a6275;
  --font-display: "Marcellus", "Palatino Linotype", Palatino, Georgia, serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --radius: 10px;
}
* { box-sizing: border-box; }
body { background: var(--ground); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55; }
a { color: var(--accent); }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; text-wrap: balance; margin: 0; }
.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 16px; }
.shell { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100vh; }
.sidebar { background: var(--nav-bg); color: var(--nav-ink); border-right: 1px solid var(--line); padding: 24px 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
.brand { padding: 0 10px; }
.brand .org { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--nav-dim); line-height: 1.4; }
.brand .name { font-family: var(--font-display); font-size: 22px; line-height: 1.2; margin-top: 6px; color: var(--nav-ink); }
.nav-group { display: grid; gap: 2px; }
.nav-label { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--nav-dim); padding: 0 10px 4px; }
.nav-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; font: 600 15px var(--font-body); color: var(--nav-ink); background: transparent; border: 0; border-radius: 8px; padding: 9px 10px; cursor: pointer; }
.nav-item svg { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; opacity: .9; }
.nav-item:hover { background: var(--nav-hover); }
.nav-item[aria-current="page"] { background: var(--nav-active); color: var(--nav-active-ink); }
.side-foot { margin-top: auto; padding: 12px 10px 0; border-top: 1px solid var(--line); font-size: 13px; color: var(--nav-dim); }
.side-foot .motto { font-family: var(--font-display); font-size: 15px; color: var(--nav-ink); }
.topbar { display: none; }
.content { min-width: 0; }
.content-inner { max-width: 1120px; margin: 0 auto; padding-inline: 32px; }
.page-hello h2 { font-size: clamp(26px, 4vw, 34px); }
.page-hello p { margin: 6px 0 0; color: var(--muted); max-width: 62ch; }
@media (max-width: 880px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .sidebar { position: static; height: auto; padding: 0 16px 12px; gap: 12px; }
  .sidebar[data-open="false"] { display: none; }
  .sidebar { border-right: 0; border-bottom: 1px solid var(--line); padding-top: 12px; }
  .sidebar .brand { display: none; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--nav-bg); color: var(--nav-ink); border-bottom: 1px solid var(--line); padding: 14px 16px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
  .topbar .name { font-family: var(--font-display); font-size: 19px; line-height: 1.2; }
  .topbar .org { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--nav-dim); }
  .menu-btn { font: 600 14px var(--font-body); color: var(--nav-ink); background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
  .content-inner { padding-inline: 16px; }
}
main { padding-block: 32px 64px; }
.section-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.section-head h2 { font-size: 28px; }
.section-head p { margin: 4px 0 0; color: var(--muted); max-width: 62ch; }
.grid-home { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; }
@media (max-width: 760px) { .grid-home { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; min-width: 0; }
.panel h3 { font-size: 19px; margin-bottom: 12px; }
.stack { display: grid; gap: 20px; align-content: start; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.empty { color: var(--muted); font-size: 15px; padding: 10px 0; }
.btn { font: 600 14px var(--font-body); border-radius: 8px; padding: 8px 14px; cursor: pointer; border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.quiet { background: transparent; color: var(--muted); border-color: var(--line); }
.btn.danger { background: transparent; color: var(--accent); border-color: var(--line); }
.btn[disabled] { opacity: .5; cursor: default; }
.row-actions { display: flex; gap: 8px; flex-wrap: wrap; }
/* event list */
.evt { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); align-items: start; }
.evt:first-child { border-top: 0; }
.datechip { text-align: center; border: 1px solid var(--line); border-radius: 8px; padding: 4px 0; font-variant-numeric: tabular-nums; }
.datechip .m { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
.datechip .d { font-family: var(--font-display); font-size: 24px; line-height: 1.1; }
.evt h4 { margin: 0; font-size: 16px; }
.evt .meta { color: var(--muted); font-size: 14px; }
.tag { display: inline-block; font-size: 12px; font-weight: 600; letter-spacing: .03em; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.tag.chapter { color: var(--lady); border-color: var(--lady); }
.tag.tta { color: var(--tta); border-color: var(--tta); }
.lady { color: var(--lady); }
.tta-text { color: var(--tta); }
.datechip.tta .m { color: var(--tta); }
.datechip.lady .m { color: var(--lady); }
.cal .pill.tta { background: var(--tta-soft); }
.cal .pill.lady { background: var(--lady-soft); }
.tta-chip { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--tta); background: var(--tta-soft); border-radius: 99px; padding: 2px 8px; }
.tag.deadline { color: var(--warn); border-color: var(--warn); }
/* calendar */
.cal-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.cal-bar .month { font-family: var(--font-display); font-size: 22px; min-width: 190px; }
.cal-scroll { overflow-x: auto; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(40px, 1fr)); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.cal .dow { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); padding: 8px; border-bottom: 1px solid var(--line); }
.cal .day { min-height: 84px; padding: 6px; border-top: 1px solid var(--line); border-left: 1px solid var(--line); font-variant-numeric: tabular-nums; min-width: 0; }
.cal .day:nth-child(7n+1) { border-left: 0; }
.cal .day.out { background: var(--sunk); color: var(--muted); }
.cal .day.today .n { background: var(--accent); color: var(--on-accent); border-radius: 99px; padding: 0 7px; }
.cal .n { font-size: 13px; font-weight: 600; }
.cal .pill { display: block; margin-top: 4px; font-size: 12px; line-height: 1.3; padding: 2px 6px; border-radius: 6px; background: var(--accent-soft); color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 0; width: 100%; text-align: left; cursor: pointer; font-family: var(--font-body); }
@media (max-width: 560px) { .cal .day { min-height: 56px; } .cal .pill { font-size: 0; height: 8px; padding: 0; } }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.chipbtn { font: 600 13px var(--font-body); padding: 5px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; }
.chipbtn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
/* projects */
.summary { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.proj-list { display: grid; gap: 12px; }
.proj { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; }
.proj h4 { margin: 0; font-size: 17px; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 99px; border: 1px solid currentColor; white-space: nowrap; }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 99px; background: currentColor; }
.st-idea { color: var(--muted); } .st-planning { color: var(--gold); } .st-progress { color: var(--accent); } .st-complete { color: var(--good); } .st-hold { color: var(--hold); }
.bar { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; margin-top: 8px; }
.bar span { display: block; height: 100%; background: var(--accent); }
.kv { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 14px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
.kv b { color: var(--ink); font-weight: 600; }
.confirm { font-size: 12px; font-weight: 700; color: var(--warn); }
/* resources */
.res-groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
.res { padding: 10px 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.res:first-of-type { border-top: 0; }
.res a { font-weight: 600; text-decoration: none; }
.res a:hover { text-decoration: underline; }
.res p { margin: 2px 0 0; font-size: 14px; color: var(--muted); }
/* announcements */
.ann { padding: 12px 0; border-top: 1px solid var(--line); }
.ann:first-child { border-top: 0; }
.ann h4 { margin: 0; font-size: 16px; }
.ann p { margin: 4px 0 0; white-space: pre-wrap; }
/* forms */
dialog { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--ink); padding: 0; width: min(560px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(20, 10, 12, .45); }
dialog form { padding: 20px; display: grid; gap: 12px; }
dialog h3 { font-size: 22px; }
label { display: grid; gap: 4px; font-size: 14px; font-weight: 600; }
#bylaws-search { max-width: 520px; }
.area-block { border-left: 3px solid var(--accent); padding-left: 14px; display: grid; gap: 10px; }
.area-head { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
table.swot { border-collapse: collapse; width: 100%; min-width: 720px; font-size: 14px; }
table.swot th, table.swot td { border: 1px solid var(--line); padding: 8px; vertical-align: top; text-align: left; }
table.swot thead th { background: var(--accent-soft); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
table.swot tbody th { width: 180px; font-weight: 600; }
.swot-cell { all: unset; display: block; width: 100%; min-height: 40px; cursor: pointer; }
.swot-cell:focus-visible { outline: 2px solid var(--gold); }
input, select, textarea { font: 15px var(--font-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
textarea { min-height: 84px; resize: vertical; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 480px) { .two { grid-template-columns: 1fr; } }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--ground); padding: 10px 16px; border-radius: 8px; font-size: 14px; max-width: calc(100vw - 32px); }
.editor-note { font-size: 13px; color: var(--muted); }
.detail dt { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-top: 8px; }
.detail dd { margin: 2px 0 0; white-space: pre-wrap; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
.kit h4 { margin: 18px 0 6px; font-size: 15px; }
.kit-list { margin: 0; padding-left: 20px; }
.kit-list li { margin: 4px 0; }
.kit-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.kit-table th, .kit-table td { text-align: left; vertical-align: top; padding: 6px 8px; border-top: 1px solid var(--line, #ddd); }
.kit-table th { white-space: nowrap; width: 1%; }
.kit-templates { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.kit-tpl ul { margin: 6px 0 0; padding-left: 18px; font-size: 14px; }
@media (max-width: 560px) { .kit-table th { white-space: normal; } }
.su-form label { display: block; margin: 10px 0 0; font-weight: 600; font-size: 14px; }
.su-form input, .su-form select, .su-form textarea { display: block; width: 100%; box-sizing: border-box; margin-top: 4px; font: inherit; font-weight: 400; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
.su-form textarea { min-height: 80px; }
.su-choice { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.su-choice label { display: flex; align-items: center; gap: 6px; margin: 0; font-weight: 400; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.su-choice input { width: auto; margin: 0; }
.su-req { border-top: 1px solid var(--line); padding: 10px 0; }
.su-req:first-of-type { border-top: 0; }
.su-msg { margin-top: 10px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--sunk); }
.su-filter { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 10px; }
/* leadership and committees */
.h-sub { font-size: 22px; }
.officer-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.person { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.person .role, .org-col .role { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: var(--accent); }
.person .who, .org-col .who { font-family: var(--font-display); font-size: 20px; line-height: 1.25; }
.person p { margin: 4px 0 0; font-size: 14px; color: var(--muted); }
.org-map { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.org-col { display: grid; gap: 10px; align-content: start; }
.org-col h4 { margin: 6px 0 4px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.org-col ul { margin: 0; padding-left: 18px; font-size: 15px; }
.org-col li { margin: 2px 0; }
.cta { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; background: var(--accent-soft); border-color: transparent; }
.com-tools { display: grid; gap: 10px; }
.search { max-width: 420px; background: var(--surface); }
.com-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; align-items: start; }
.com-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 8px; min-width: 0; }
.com-card .grp { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: var(--muted); }
.com-card h4 { margin: 0; font-size: 18px; line-height: 1.3; }
.people-rows { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 12px; margin: 0; font-size: 15px; }
.people-rows dt { color: var(--muted); }
.people-rows dd { margin: 0; font-weight: 600; }
.com-card .charge { margin: 0; font-size: 14px; color: var(--muted); }
.com-card details { border-top: 1px solid var(--line); padding-top: 8px; }
.com-card summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--accent); }
.com-card details p { margin: 8px 0 0; font-size: 14px; }
/* pink cards for the Ladies */
.person, .com-card, .org-col { background: var(--lady-card); border-color: var(--lady-line); }
.com-card details { border-top-color: var(--lady-line); }
.members { border-top: 1px solid var(--lady-line); padding-top: 8px; }
.members-label { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: var(--muted); }
.members ul { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 14px; }
.com-card.is-tta .members, .com-card.is-tta details { border-top-color: var(--line); }
/* Ladies in pink, Top Teens in blue */
.area-block.area-lady { border-left-color: var(--lady); }
.area-block.area-tta { border-left-color: var(--tta); }
.proj-tta { border-color: var(--tta); }
.person.is-tta, .com-card.is-tta { border-color: var(--tta); background: var(--tta-soft); }
.person.is-tta .role { color: var(--tta); }
</style>

</head>
<body>
<div id="app"></div>
<form name="committee-request" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="bot-field"><input name="name"><input name="action"><input name="committee"><input name="role"><input name="timing"><textarea name="note"></textarea>
</form>

<script id="portal-app">
(() => {
  const STATUSES = ["Idea", "Planning", "In progress", "Complete", "On hold"];
  const STATUS_CLASS = { "Idea": "st-idea", "Planning": "st-planning", "In progress": "st-progress", "Complete": "st-complete", "On hold": "st-hold" };
  const TYPES = ["Chapter", "Executive Board", "Committee", "Program", "Top Teens", "Training", "Deadline", "Area / National", "Social"];
  const GROUPS = ["Governance", "Members", "Forms", "Programs", "Officers and advisors", "References"];
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const TABS = [["home","Home"],["calendar","Calendar"],["projects","Programs & Projects"],["leadership","Leadership"],["committees","Committees"],["signup","Committee Sign-Up"],["kit","Chair Success Kit"],["bylaws","Bylaws"],["resources","Resources"],["feedback","Feedback"]];
  const NAV = [["Chapter", ["home", "calendar"]], ["Service", ["projects"]], ["People", ["leadership", "committees", "signup", "kit"]], ["Reference", ["bylaws", "resources", "feedback"]]];
  const ICONS = {
    home: "M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z",
    calendar: "M4 6h16v14H4z M4 10h16 M8 3v4 M16 3v4",
    projects: "M3 20h18 M6 20v-6 M11 20V8 M16 20v-10",
    leadership: "M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z",
    committees: "M9 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M3 20a6 6 0 0 1 12 0 M16 5a3 3 0 0 1 0 6 M18 20a6 6 0 0 0-2.5-4.9",
    signup: "M9 3h6v3H9z M7 4.5H5V21h14V4.5h-2 M8.5 13.5l2.5 2.5 4.5-4.5",
    kit: "M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3",
    bylaws: "M6 3h9l4 4v14H6z M14 3v5h5 M9 12h7 M9 16h7",
    resources: "M3 6h6l2 2h10v11H3z",
    feedback: "M4 5h16v11H9l-5 4z"
  };
  const COMMITTEE_GROUPS = ["Officers", "National Program Thrusts", "National Strategic Partners", "National Projects", "Chapter partnerships", "Standing committees", "Special committees"];
  const AREA_CATEGORIES = ["National Programs (First Vice President)", "National Programs: Strategic Partners", "National Projects (Second Vice President)", "Chapter operations"];

  let state = {};
  const embedded = document.getElementById("portal-state");
  let loaded = !!embedded;
  if (embedded) { try { state = JSON.parse(embedded.textContent); } catch (e) { state = {}; } }
  function normalize() {
